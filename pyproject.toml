[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "A cross-platform file organization tool with CLI and GUI interfaces."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["customtkinter==5.2.2", "Pillow>=10.4,<13"]
authors = [
    {name = "Dhruv Akbari", email = "dhruvakbari303@gmail.com"},
]
keywords = ["file-organizer", "file-manager", "cli", "gui", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MrAkbari91/file-organizer"
Repository = "https://github.com/MrAkbari91/file-organizer"
Issues = "https://github.com/MrAkbari91/file-organizer/issues"

[project.scripts]
file-organizer = "file_organizer.cli.app:main"

[project.gui-scripts]
file-organizer-gui = "file_organizer.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
file_organizer = ["gui/assets/*"]
